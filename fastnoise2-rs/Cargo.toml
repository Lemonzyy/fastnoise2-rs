[package]
name = "fastnoise2"
version = "0.4.0"
edition.workspace = true
description = "A safe Rust wrapper for FastNoise2, a node-based noise generation library optimized with SIMD."
keywords = ["noise", "simd", "procedural", "perlin", "simplex"]
repository.workspace = true
license.workspace = true
rust-version.workspace = true
exclude = ["examples/*.png", "examples/*.bmp"]
readme.workspace = true

[dependencies]
base64 = { version = "0.23", optional = true }
bitflags = "2"
fastnoise2-sys = { version = "0.2", path = "../fastnoise2-sys" }
thiserror = "2"
tracing = { version = "0.1", optional = true }

[package.metadata.docs.rs]
features = ["encode"]

[[example]]
name = "encode"
required-features = ["encode"]

[dev-dependencies]
image = "0.25"

[features]
build-from-source = ["fastnoise2-sys/build-from-source"]
encode = ["dep:base64"]
trace = ["dep:tracing"]
